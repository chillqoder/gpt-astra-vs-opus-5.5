        ctx.fillStyle = '#a07020'; ctx.fillRect(Math.round(p.x), Math.round(p.y) + 1, 2, 1);
        break;
      case 'star': {

        ctx.fillRect(Math.round(p.x), Math.round(p.y) - s, 1, s * 2 + 1);
        break;
      }
      case 'sweat':

        break;
      case 'confetti':
        ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), (G.t + i) % 8 < 4 ? 2 : 1, 2);
        break;
      case 'ember': case 'ash':
        ctx.globalAlpha = Math.min(1, k * 2);

      case 'ring':

      case 'flash':

      case 'drop':
        ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 3);

    }
    ctx.globalAlpha = 1;
  }
}

// --- particle recipes ---
function dust(x, y, n, col, spread) {
  col = col || zoneDustColor(x);
  for (let i = 0; i < n; i++) {
    const p = part('dust', x + rnd(-3, 3), y - rnd(0, 3), rnd(-1, 1) * (spread || 1), rnd(-0.7, -0.1), rndi(16, 30), rnd(1.5, 3.5), col);
    p.drag = 0.92; p.grow = 0.08; p.alpha = 0.8;
  }
}
function smoke(x, y, n, size, col) {
  for (let i = 0; i < n; i++) {
    const p = part('smoke', x + rnd(-4, 4), y + rnd(-4, 4), rnd(-0.3, 0.3), rnd(-0.9, -0.3), rndi(40, 70), rnd(2, 4) * (size || 1), col || pick(['#4a4048', '#5c5258', '#3c343c']));

}
function sparks(x, y, n, col, speed) {

// --- explosions (visual + gameplay) ---
function spawnBoom(x, y, r, opts) {
  opts = opts || {};
  const blobs = [];
  const nb = r > 20 ? 6 : 4;
  for (let i = 0; i < nb; i++) blobs.push({ dx: rnd(-r, r) * 0.5, dy: rnd(-r, r * 0.3) * 0.5, s: rnd(0.45, 0.8), d: rndi(0, 4) });
  blobs.push({ dx: 0, dy: 0, s: 0.85, d: 0 });
  const max = Math.round(24 + r * 0.5);
  G.fx.push({ kind: 'boom', x, y, r, t: 0, max, blobs });
  part('flash', x, y, 0, 0, 5, r * 1.3, '#fffbe8');
  const rg = part('ring', x, y, 0, 0, 14, r * 0.5, '#fff6c0'); rg.grow = r * 0.09;
  sparks(x, y, Math.round(r * 0.4), null, r / 18);
  debris(x, y, Math.round(r * 0.25), opts.cols || ['#4a3a30', '#6a5040', '#2a2020', '#806050'], r / 26);
  for (let i = 0; i < r / 5; i++) {
    const p = part('ember', x + rnd(-r, r) * 0.4, y + rnd(-r, r) * 0.4, rnd(-2, 2), rnd(-3, -0.5), rndi(20, 50), 1, pick(['#ffd040', '#ff8020']));
    p.g = 0.06;
  }
  if (!opts.silent) Snd.play(r > 30 ? 'explosion' : 'smallboom', r / 30);
  shake(Math.min(14, r * 0.22));
  if (r >= 34) { hitStop(3); }
}
function updateFx() {
  for (const f of G.fx) {
    f.t++;
    if (f.kind === 'boom') {
      if (f.t === Math.round(f.max * 0.55)) smoke(f.x, f.y - f.r * 0.3, Math.max(2, Math.round(f.r / 7)), f.r / 16);
      if (f.t >= f.max) f.remove = true;
    } else if (f.kind === 'muzzle' || f.kind === 'slash') {
      if (f.t >= f.max) f.remove = true;
    } else if (f.kind === 'beam') {
      if (f.t >= f.max) f.remove = true;
    } else if (f.kind === 'custom') {
      f.update(f);
    }
  }
  sweep(G.fx);
}
function drawFx() {
  for (const f of G.fx) {
    if (f.kind === 'boom') {
      const p = f.t / f.max;
      for (const b of f.blobs) {
        const q = clamp((f.t - b.d) / (f.max - b.d), 0, 1);
        if (f.t < b.d) continue;
        const grow = q < 0.18 ? q / 0.18 : 1 + (q - 0.18) * 0.35;
        const rr = f.r * b.s * grow * (q > 0.6 ? 1 - (q - 0.6) * 1.8 : 1);
        if (rr < 1) continue;
        const x = f.x + b.dx * (0.6 + q), y = f.y + b.dy * (0.6 + q) - q * f.r * 0.35;
        if (q >= 0.6) {
          // fireball cools into a puff of dark smoke
          ctx.globalAlpha = clamp(1 - (q - 0.6) / 0.4, 0, 1) * 0.9;
          dcirc(x, y, rr + 1, '#2a2026'); dcirc(x, y, rr, '#5a4c54'); dcirc(x - rr * 0.25, y - rr * 0.3, rr * 0.45, '#6e6068');
          ctx.globalAlpha = 1;
          continue;
        }
        const ci = q < 0.1 ? 0 : q < 0.26 ? 1 : q < 0.44 ? 2 : 3;
        dcirc(x, y, rr + 1.5, ci === 0 ? '#ffd040' : '#a0300c');
        dcirc(x, y, rr, FIRE_COLS[ci]);
        dcirc(x - rr * 0.2, y - rr * 0.25, rr * 0.5, FIRE_COLS[Math.max(0, ci - 1)]);
      }
      if (p < 0.12) { ctx.globalAlpha = 0.6; dcirc(f.x, f.y, f.r * 1.2, '#ffffff'); ctx.globalAlpha = 1; }
    } else if (f.kind === 'muzzle') {
      drawMuzzle(f);
    } else if (f.kind === 'slash') {
      drawSlash(f);
    } else if (f.kind === 'beam') {
      drawBeam(f);
    } else if (f.kind === 'custom') {
      f.draw(f);
    }
  }
}
function drawMuzzle(f) {
  const s = f.size * (1 - f.t / (f.max + 1));
  const cx = Math.round(f.x), cy = Math.round(f.y);
  const dx = Math.cos(f.a), dy = Math.sin(f.a);
  dcirc(cx + dx * s * 0.6, cy + dy * s * 0.6, s * 0.75 + 1, f.col2 || '#ff9a20');
  dcirc(cx + dx * s * 0.5, cy + dy * s * 0.5, s * 0.5, f.col || '#fff6b0');
  ctx.fillStyle = f.col || '#fff6b0';
  for (let i = 0; i < 3; i++) {
    const a = f.a + (i - 1) * 0.6;
    ctx.fillRect(Math.round(cx + Math.cos(a) * s * 1.4) - 1, Math.round(cy + Math.sin(a) * s * 1.4) - 1, 2, 2);
  }
}
function drawSlash(f) {
  const k = f.t / f.max;
  ctx.strokeStyle = k < 0.4 ? '#ffffff' : '#bfe8ff';
  ctx.lineWidth = 3 - k * 2;
  ctx.beginPath();
  const a0 = f.dir > 0 ? -1.4 : PI + 1.4, a1 = f.dir > 0 ? 1.0 : PI - 1.0;
  const a = lerp(a0, a1, Math.min(1, k * 1.8));
  ctx.arc(Math.round(f.x), Math.round(f.y), 14, Math.min(a0, a), Math.max(a0, a));
  ctx.stroke();
}
function drawBeam(f) {
  const w = f.w * (1 - f.t / (f.max + 1));
  ctx.lineCap = 'round';
  ctx.strokeStyle = f.c1; ctx.lineWidth = w + 3;
  ctx.beginPath(); ctx.moveTo(f.x0, f.y0); ctx.lineTo(f.x1, f.y1); ctx.stroke();
  ctx.strokeStyle = f.c2; ctx.lineWidth = Math.max(1, w);
  ctx.beginPath(); ctx.moveTo(f.x0, f.y0); ctx.lineTo(f.x1, f.y1); ctx.stroke();
  ctx.lineCap = 'butt';
}
function muzzle(x, y, a, size, col, col2) {
  G.fx.push({ kind: 'muzzle', x, y, a, size: size || 5, t: 0, max: 3, col, col2 });
}

// --- floating text & speech bubbles ---
function floatText(x, y, str, color, scale, life) {
  G.texts.push({ x, y, str: String(str), color: color || '#fff', scale: scale || 1, life: life || 50, max: life || 50, vy: -1.1 });
}
function bubble(ent, str, life, dy) {
  for (const t of G.texts) if (t.follow === ent && t.bubble) t.life = 0;
  G.texts.push({ follow: ent, bubble: true, str, life: life || 60, max: life || 60, dy: dy || 0, x: ent.x, y: ent.y });
}
function updateTexts() {
  for (const t of G.texts) {
    t.life--;
    if (t.follow) { t.x = t.follow.x; t.y = t.follow.y - t.follow.h - 6 + (t.dy || 0); if (t.follow.remove) t.life = 0; }
    else if (t.ghost) { t.y -= 0.7; t.x += Math.sin(t.life * 0.15) * 0.5; }
    else { t.y += t.vy; t.vy *= 0.94; }
    if (t.life <= 0) t.remove = true;
  }
  sweep(G.texts);
}
function drawTexts() {
  for (const t of G.texts) {
    if (t.ghost) {
      // a little cartoon spirit floating away from the fallen hero
      ctx.globalAlpha = Math.min(1, t.life / 30) * 0.8;
      const x = t.x, y = t.y;
      fr(-4, -10, 8, 9, '#f0f8ff'); fr(-5, -4, 10, 5, '#f0f8ff'); fr(-5, 1, 3, 2, '#f0f8ff'); fr(2, 1, 3, 2, '#f0f8ff');
      fr(-2, -8, 1, 2, INK); fr(1, -8, 1, 2, INK); fr(-1, -5, 2, 1, INK);
      fr(-6 - ((G.t >> 3) % 2), -6, 2, 3, '#ffffff'); fr(4 + ((G.t >> 3) % 2), -6, 2, 3, '#ffffff');
      fr(-3, -14, 6, 1, '#ffe040', 1);
      fdraw(x, y, false, null, 0, 0, '#7a90b0');
      ctx.globalAlpha = 1;
      continue;
    }
    if (t.bubble) {
      const w = textWidth(t.str) + 6, x = Math.round(t.x - w / 2), y = Math.round(t.y - 12);
      const pop = t.max - t.life < 4 ? 0.5 : 1;
      if (pop < 1) continue;
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 1, y - 1, w + 2, 12);
      ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, 10);
      ctx.fillStyle = OUTLINE; ctx.fillRect(Math.round(t.x) - 1, y + 10, 3, 2); ctx.fillRect(Math.round(t.x), y + 12, 1, 1);
      ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(t.x), y + 10, 1, 1);
      drawText(t.str, x + 3, y + 2, '#201020', 1, 0, false);
    } else {
      if (t.life < 12 && (t.life & 1)) continue;
      drawText(t.str, t.x, t.y, t.color, t.scale, 1, true);
    }
  }
}

const GUNLEN = { pistol: 6, rifle: 11, hmg: 12, spread: 10, flame: 11, rocket: 10, laser: 11, mg: 14, sniper: 15, knife: 6 };

function hipOf(pose) {
  let h = -10;
  if (pose.leg === 'crouch' || pose.leg === 'cwalk') h = -6;
  else if (pose.leg === 'sit') h = -3;
  else if (pose.leg === 'jump') h = -11;
  return h + (pose.bob || 0);
}
function armGeom(st, pose) {
  const B = st.bulky ? 1 : 0, hip = hipOf(pose), top = hip - (9 + B);
  const a = pose.aim || 0, dx = Math.cos(a), dy = Math.sin(a);
  const sx = 1 + B * 2 + (dy < -0.8 ? 1 : 0), sy = top + 3;
  const hx = sx + dx * 5, hy = sy + dy * 5, gl = GUNLEN[pose.gun] || 8;
  return { sx, sy, hx, hy, dx, dy, mx: hx + dx * gl, my: hy + dy * gl, top };
}
function leg(hx, hy, fx, fy, kx, ky, c, bc) {
  if (kx === undefined) { kx = (hx + fx) / 2; ky = (hy + fy - 2) / 2; }
  fline(hx, hy, kx, ky, 3, c);
  fline(kx, ky, fx, fy - 2, 3, c);
  fr(fx - 1, fy - 3, 5, 3, bc);

function drawLegs(pose, hip, st) {
  const pc = st.pants, pd = st.pantsD, bc = st.boots;
  switch (pose.leg) {
    case 'run': {
      const th = pose.ph * TAU;
      const la = Math.max(0, Math.cos(th)) * 4, lb = Math.max(0, Math.cos(th + PI)) * 4;
      const fa = Math.sin(th) * 5 + 1, fb = Math.sin(th + PI) * 5 + 1;
      leg(-1, hip, fb, -lb, (fb - 1) / 2 + 2 + lb * 0.5, (hip - lb) / 2 - 1, pd, bc);

    }
    case 'jump': leg(-1, hip, -3, -2, -3, hip + 4, pd, bc); leg(2, hip, 4, -5, 6, hip + 2, pc, bc); break;
    case 'fall': leg(-1, hip, -3, -1, undefined, undefined, pd, bc); leg(2, hip, 3, 0, 4, hip / 2 - 1, pc, bc); break;
    case 'crouch': case 'cwalk': {
      const s = pose.leg === 'cwalk' ? Math.sin(pose.ph * TAU) * 2 : 0;
      fline(-2, hip, 0, -2, 3, pd); fline(0, -2, -5 - s, -2, 3, pd); fr(-8 - s, -4, 4, 3, bc);

    case 'dance': {

      leg(-1, hip, -3 + s * 2, s > 0 ? -3 : 0, undefined, undefined, pd, bc); leg(2, hip, 4 + s * 2, s < 0 ? -3 : 0, undefined, undefined, pc, bc);

  }
}
function drawGun(g, gun, flash) {

  let a, b;
  switch (gun) {

    case 'rifle': a = P(-4); b = P(11); fline(a[0], a[1], b[0], b[1], 2, '#3c3228'); a = P(-5); b = P(0); fline(a[0], a[1], b[0], b[1], 3, '#7a4a28'); break;

// main humanoid renderer. pose: {leg, ph, aim, gun, arm, at, face, bob, noHat}
function drawHuman(x, y, face, st, pose, flash, rot, alpha) {
  const B = st.bulky ? 1 : 0, T = G.t;
  const hip = hipOf(pose), tw = 8 + B * 5, th = 9 + B, top = hip - th;
  const arm = st.arm || st.skin, armD = st.armD || st.skinD;
  const sx = 1 + B * 2, sy = top + 3;
  const ph = pose.ph || 0;
  let g = null;
  // --- back arm ---
  switch (pose.arm) {
    case 'gun':
      g = armGeom(st, pose);
      if (TWOHAND[pose.gun]) {
        const tx = g.hx + g.dx * 4, ty = g.hy + g.dy * 4 + 1;
        fline(-2, sy, (tx - 2) / 2 - 1, (sy + ty) / 2 + 2, 3, armD);
        fline((tx - 2) / 2 - 1, (sy + ty) / 2 + 2, tx, ty, 3, armD);
      } else fline(-2, sy, -3, sy + 6, 3, armD);
      break;
    case 'panic': case 'dance': {
      const a = -1.7 + Math.sin(T * 0.55 + 2) * 0.8;
      fline(-2, sy, -2 + Math.cos(a) * 7, sy + Math.sin(a) * 7, 3, armD);
      break;
    }
    case 'carry': fline(-2, sy, -3, top - 6, 3, armD); break;
    case 'tied': break;
    default: {
      const sw = pose.leg === 'run' ? Math.sin(ph * TAU) * 3 : 0;
      fline(-2, sy, -2 - sw, sy + 6, 3, armD);
    }
  }
  // --- legs ---
  drawLegs(pose, hip, st);
  // --- torso ---
  fr(-tw / 2, top, tw, th, st.shirt);
  fr(-tw / 2, top + th - 4, tw, 2, st.shirtD);
  fr(-tw / 2, hip - 2, tw, 2, st.belt);
  switch (st.deco) {
    case 'bandolier': for (let i = 0; i < 4; i++) fr(-3 + i * 2, top + 1 + i * 2, 2, 1, '#e8c048'); fr(1, top + 1, 1, 2, '#c0c8d0'); break;
    case 'armband': fr(1, top + 2, 2, 2, st.shirtD); break;
    case 'abs': fr(-1, top + 3, 1, 4, st.skinD); fr(1, top + 3, 1, 4, st.skinD); fr(-3, top + 1, 6, 1, st.skinD); break;
    case 'armor': fr(-tw / 2 - 1, top - 1, tw + 2, 5, '#8a929c'); fr(-tw / 2, top, tw, 1, '#b8c0c8'); fr(-tw / 2 - 2, top - 1, 4, 4, '#9aa2ac'); break;
    case 'ghillie': fr(-5, top + 2, 2, 3, '#7a8a44'); fr(3, top + 4, 2, 3, '#4a5a22'); fr(-2, top - 1, 3, 2, '#7a8a44'); break;
    case 'dynamite':
      for (let i = 0; i < 3; i++) fr(-4 + i * 3, top + 2, 2, 5, '#d83424');
      fr(-4, top + 4, 8, 1, '#3a3a3a');
      if ((T >> 2) % 2) fr(3, top - 1, 2, 2, '#ffe040', 1);
      break;
    case 'captive': fr(-tw / 2, hip - 2, tw, 2, '#f0eee6'); fr(-tw / 2 + 1, hip - 1, 2, 1, '#e04040'); fr(1, hip - 1, 2, 1, '#e04040'); break;
  }
  // --- head ---
  const hx = -3 + B, hy = top - 7 + (pose.hbob || 0);
  const noHat = pose.noHat;
  fr(hx, hy, 7, 7, st.skin);
  fr(hx + 7, hy + 3, 1, 2, st.skinD);
  fr(hx + 1, hy + 3, 1, 2, st.skinD);
  const ex = hx + 4, ey = hy + 2;
  switch (pose.face) {
    case 'panic':
      fr(ex - 1, ey - 1, 3, 3, '#ffffff'); fr(ex + 1, ey, 1, 1, INK);
      fr(ex, ey + 3, 3, 3, INK); fr(ex + 1, ey + 5, 1, 1, '#e05070');
      break;
    case 'dead':
      fr(ex, ey, 1, 1, INK); fr(ex + 2, ey, 1, 1, INK); fr(ex + 1, ey + 1, 1, 1, INK); fr(ex, ey + 2, 1, 1, INK); fr(ex + 2, ey + 2, 1, 1, INK);
      fr(ex + 1, ey + 4, 2, 1, '#e05070');
      break;
    case 'happy':
      fr(ex, ey, 2, 1, INK); fr(ex - 1, ey + 1, 1, 1, INK);
      fr(ex, ey + 3, 3, 1, INK); fr(ex + 1, ey + 4, 2, 1, '#e05070');
      break;
    case 'hurt':
      fr(ex - 1, ey + 1, 3, 1, INK); fr(ex, ey + 3, 2, 2, INK);
      break;
    case 'shout':
      fr(ex, ey, 1, 2, INK); fr(ex - 1, ey - 1, 3, 1, st.hair || INK); fr(ex, ey + 3, 3, 2, INK);
      break;
    default:
      fr(ex, ey, 1, 2, INK); fr(ex - 1, ey - 1, 3, 1, st.hair || INK);
      if (pose.face === 'grin') fr(ex, ey + 3, 3, 1, '#ffffff');
  }
  if (!noHat) switch (st.hat) {
    case 'bandana': {
      const wv = pose.wind ? 2 : 0.5, s1 = Math.sin(T * 0.35) * wv, s2 = Math.sin(T * 0.35 + 1.4) * wv;
      fr(hx - 1, hy - 1, 7, 3, st.hair); fr(hx + 1, hy - 2, 2, 1, st.hair); fr(hx + 4, hy - 2, 2, 1, st.hair);
      fr(hx - 1, hy + 1, 8, 2, st.hatC); fr(hx + 1, hy + 1, 2, 1, '#ff7060');
      fr(hx - 4 - (pose.wind ? 1 : 0), hy + 1 + Math.round(s1), 3 + (pose.wind ? 1 : 0), 1, st.hatC);
      fr(hx - 5 - (pose.wind ? 2 : 0), hy + 2 + Math.round(s2), 3 + (pose.wind ? 1 : 0), 1, st.hatD);
      break;
    }
    case 'helmet':
      fr(hx - 1, hy - 2, 9, 4, st.hatC); fr(hx - 2, hy + 1, 11, 1, st.hatD); fr(hx + 1, hy - 1, 3, 1, '#b8b060');
      fr(hx + 2, hy + 2, 1, 4, st.hatD);
      break;
    case 'mask':
      fr(hx, hy - 1, 7, 8, st.hatC); fr(hx + 3, hy + 2, 4, 2, st.skin); fr(ex, ey, 1, 2, INK);
      fr(hx - 1, hy, 8, 1, st.hatD); fr(hx - 3, hy + Math.round(Math.sin(T * 0.4)), 2, 1, st.hatD);
      break;
    case 'hood':
      fr(hx - 1, hy - 2, 8, 5, st.hatC); fr(hx - 2, hy + 2, 3, 5, st.hatC); fr(hx + 2, hy - 3, 2, 1, '#7a8a44');
      fr(hx + 3, hy + 1, 4, 2, '#202830'); fr(hx + 5, hy + 1, 2, 1, '#80e0ff');
      break;
    case 'heavy':
      fr(hx - 1, hy - 2, 9, 9, st.hatC); fr(hx + 3, hy + 2, 6, 2, '#16161c'); fr(hx + 5, hy + 2, 3, 1, (T >> 3) % 2 ? '#ff5030' : '#ff9060');
      fr(hx, hy - 1, 2, 1, '#8a929c'); fr(hx - 1, hy + 5, 9, 2, st.hatD);
      break;
    case 'cap':
      fr(hx, hy - 1, 7, 2, st.hatC); fr(hx + 5, hy, 4, 1, st.hatD);
      break;
    case 'wild':
      fr(hx - 1, hy - 2, 2, 3, st.hair); fr(hx + 2, hy - 3, 2, 3, st.hair); fr(hx + 5, hy - 2, 2, 2, st.hair); fr(hx - 2, hy, 2, 3, st.hair);
      fr(ex - 1, ey - 1, 3, 3, '#ffffff'); fr(ex, ey, 1, 1, INK);
      break;
    case 'bald':
      fr(hx + 1, hy - 1, 5, 1, st.skin); fr(hx + 2, hy + 4, 6, 4, st.beard); fr(hx + 4, hy + 5, 3, 1, INK);
      fr(hx + 3, hy + 1, 4, 1, st.beard);
      break;
  }
  else if (st.hat === 'heavy') { fr(hx, hy - 1, 7, 1, '#3a2418'); fr(ex - 1, ey - 1, 3, 1, INK); }
  // --- front arm ---
  switch (pose.arm) {
    case 'gun':
      fline(g.sx, g.sy, g.hx, g.hy, 3, arm);
      drawGun(g, pose.gun, flash);
      fr(g.hx - 1, g.hy - 1, 3, 3, st.skin);
      break;
    case 'throw': {
      const a = lerp(-2.7, -0.3, pose.at || 0), hx2 = sx + Math.cos(a) * 7, hy2 = sy + Math.sin(a) * 7;
      fline(sx, sy, hx2, hy2, 3, arm);
      if ((pose.at || 0) < 0.55) fr(hx2 - 2, hy2 - 2, 4, 4, '#3e6a2a');
      fr(hx2 - 1, hy2 - 1, 3, 3, st.skin);
      break;
    }
    case 'knife': {
      const a = lerp(-2.1, 0.9, pose.at || 0), dx = Math.cos(a), dy = Math.sin(a);
      const hx2 = sx + dx * 6, hy2 = sy + dy * 6;
      fline(sx, sy, hx2, hy2, 3, arm);
      fline(hx2, hy2, hx2 + dx * 8, hy2 + dy * 8, 2, '#e8f4ff');
      fr(hx2 - 1, hy2 - 1, 3, 3, '#5a3a22');
      break;
    }
    case 'panic': case 'dance': {
      const a = -1.5 + Math.sin(T * 0.55) * 0.9;
      const hx2 = sx + Math.cos(a) * 7, hy2 = sy + Math.sin(a) * 7;
      fline(sx, sy, hx2, hy2, 3, arm); fr(hx2 - 1, hy2 - 1, 3, 3, st.skin);
      break;
    }
    case 'salute':
      fline(sx, sy, sx + 4, sy + 1, 3, arm); fline(sx + 4, sy + 1, hx + 6, hy + 1, 3, arm); fr(hx + 5, hy, 3, 2, st.skin);

      break;
    }
    case 'fist':
      fline(sx, sy, sx + 2, sy - 9, 3, arm); fr(sx, sy - 13, 4, 4, st.skin);
      break;
    case 'carry': fline(sx, sy, sx + 1, top - 6, 3, arm); fr(sx - 1, top - 8, 3, 3, st.skin); break;
    case 'tied': fr(-tw / 2 - 1, top + 3, tw + 2, 1, '#c8a060'); fr(-tw / 2 - 1, top + 6, tw + 2, 1, '#c8a060'); break;

      const sw = pose.leg === 'run' ? -Math.sin(ph * TAU) * 3 : 0;

    }
  }
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  fdraw(x, y, face < 0, flash, rot, -12);
  ctx.globalAlpha = 1;
  return g;
}

// approximated filled circle for figure lists
function fwheel(cx, cy, r, c) {
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.4);
    fr(cx - w, cy + dy, w * 2 + 1, 1, c);
  }
}

const WEAPONS = {

const P_STAND_H = 25, P_CROUCH_H = 16;

function makePlayer(x, y) {

}
function pTarget() { const t = G.tank; return t && t.occupied ? t : G.player; }
function targetAlive() { const p = G.player; return p && (p.state === 'normal' || p.state === 'tank'); }

function playerPose(p) {
  const pose = { leg: 'stand', ph: p.runPh, aim: p.aim, gun: WEAPONS[p.weapon].gun, arm: 'gun', face: 'n', bob: 0, wind: false };
  if (p.climb) { pose.leg = 'climb'; pose.ph = p.y / 20; }
  else if (!p.onGround) { pose.leg = p.vy < 0 ? 'jump' : 'fall'; pose.wind = true; }
  else if (p.crouch) pose.leg = Math.abs(p.vx) > 0.2 ? 'cwalk' : 'crouch';
  else if (Math.abs(p.vx) > 0.3) { pose.leg = 'run'; pose.bob = Math.cos(p.runPh * TAU * 2) > 0.3 ? -1 : 0; pose.wind = true; }
  else if (p.fidget > 0) { pose.bob = (p.fidget >> 3) % 2 ? -1 : 0; pose.hbob = p.fidget % 40 < 20 ? 0 : 1; pose.face = 'grin'; }

  if (p.hurtT > 0) pose.face = 'hurt';

}
function muzzlePos(p) {

function updatePlayer(p) {
  p.t++;
  if (p.inv > 0) p.inv--;
  if (p.shield > 0) { p.shield--; if (p.shield === 120) floatText(p.x, p.y - 34, 'SHIELD LOW', '#80c8ff'); }
  if (p.hurtT > 0) p.hurtT--;
  if (p.state === 'dead') return updateDeadPlayer(p);
  if (p.hidden) return;
  if (p.state === 'tank' || p.state === 'victory' || p.state === 'intro') {
    if (p.state === 'victory' || p.state === 'intro') { p.vy = Math.min(p.vy + 0.35, 6.5); p.vx = approach(p.vx, 0, 0.3); moveBody(p, false); }
    return;
  }
  const I = Input;
  const mx = (I.down('right') ? 1 : 0) - (I.down('left') ? 1 : 0);
  const up = I.down('up'), dn = I.down('down');
  const wasGround = p.onGround, prevVy = p.vy;

  // ---- ladders ----
  const tx = Math.floor(p.x / TS);
  if (!p.climb) {
    const midT = tileAt(tx, Math.floor((p.y - 12) / TS)), footT = tileAt(tx, Math.floor((p.y + 1) / TS));
    if ((up && isLadderT(midT) && (p.onGround || p.vy > -1)) || (dn && p.onGround && footT === T_LADTOP)) {
      p.climb = true; p.x = tx * TS + 8; p.vx = 0; p.vy = 0; p.crouch = false; p.h = P_STAND_H;
      if (dn) p.y += 2;
    }
  }
  if (p.climb) {
    p.vy = (dn ? 1.3 : 0) - (up ? 1.3 : 0);
    p.vx = 0;
    if (mx) p.face = mx;
    if (p.vy) p.runPh += 0.04;
    moveBody(p, true);
    const feetT = tileAt(tx, Math.floor((p.y - 1) / TS));
    if (!isLadderT(feetT) && !isLadderT(tileAt(tx, Math.floor((p.y - 12) / TS)))) {
      p.climb = false;
      if (up) { p.y = Math.ceil(p.y / TS) * TS; p.onGround = true; }
    }
    if (p.onGround && dn) p.climb = false;
    if (I.pressed('jump')) { p.climb = false; p.vy = -4.2; p.vx = mx * 1.6; p.jumping = true; }
    p.aim = 0;
  } else {
    // ---- run / crouch ----
    const wantCrouch = dn && p.onGround;
    if (wantCrouch !== p.crouch) {
      if (wantCrouch) { p.crouch = true; p.h = P_CROUCH_H; }
      else if (!solidAt(p.x, p.y - P_STAND_H - 1)) { p.crouch = false; p.h = P_STAND_H; }
    }
    const maxv = p.crouch ? 0.85 : 1.75;
    if (mx) { p.vx = approach(p.vx, mx * maxv, p.onGround ? 0.45 : 0.32); if (p.knifeT <= 0) p.face = mx; }
    else p.vx = approach(p.vx, 0, p.onGround ? 0.55 : 0.12);
    // ---- jump (coyote time + buffering) ----
    if (I.pressed('jump')) p.jbuf = 8; else if (p.jbuf > 0) p.jbuf--;
    if (p.onGround) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
    if (p.jbuf > 0 && p.coyote > 0) {
      const under = tileAt(tx, Math.floor((p.y + 1) / TS));
      if (dn && isOnewayT(under) && p.onGround) { p.dropT = 10; p.crouch = false; p.h = P_STAND_H; }
      else { p.vy = -6.0; p.jumping = true; Snd.play('jump'); dust(p.x, p.y, 3); p.crouch = false; p.h = P_STAND_H; }
      p.jbuf = 0; p.coyote = 0;
    }
    if (p.jumping && !I.down('jump') && p.vy < -2.4) p.vy = -2.4;
    p.vy = Math.min(p.vy + 0.35, 6.5);
    if (p.dropT > 0) p.dropT--;
    moveBody(p, p.dropT > 0);
    if (p.onGround) p.jumping = false;
    if (!wasGround && p.onGround && prevVy > 2.5) { dust(p.x, p.y, 5); Snd.play('land'); }
    // ---- aim ----
    if (up && mx) p.aim = -PI / 4;

    else if (dn && !p.onGround) p.aim = mx ? PI / 4 : PI / 2;
    else p.aim = 0;
    if (p.crouch) p.aim = 0;
  }

  const lo = G.cam.x + 8, hi = G.cam.x + W - 8;
  if (p.x < lo) { p.x = lo; if (p.vx < 0) p.vx = 0; }
  if (p.x > hi) { p.x = hi; if (p.vx > 0) p.vx = 0; }
  // animation / ambience
  if (p.onGround && Math.abs(p.vx) > 0.3) {
    p.runPh = (p.runPh + Math.abs(p.vx) * 0.055) % 1;
    if (++p.stepT % 12 === 0) { dust(p.x - p.face * 3, p.y, 1); Snd.play('step'); }
  }
  if (p.onGround && Math.abs(p.vx) < 0.1 && p.cd <= 0 && !p.crouch) {

  } else p.idleT = 0;
  if (p.fidget > 0) p.fidget--;
  if (p.throwT > 0) p.throwT--;
  if (p.knifeT > 0) p.knifeT--;

  p.cd = Math.max(-30, p.cd - 1);
  const fire = I.down('fire'), fireP = I.pressed('fire');
  if ((fireP || fire) && p.knifeT <= 0) {

    if (victim) doKnife(p, victim);

    else if (p.weapon === 'P') { if ((fireP && p.cd <= 0) || (fire && p.cd <= -7)) firePlayerWeapon(p); }

    if (p.bombs > 0) {

function updateDeadPlayer(p) {

// ---- knife ----
function knifeTarget(p) {

    const dx = e.x - p.x;
    if (Math.abs(dx) < 20 + e.w / 2 && e.y - e.h < p.y && p.y - p.h < e.y && Math.abs(dx) < bd) { best = e; bd = Math.abs(dx); }
  }

function doKnife(p, e) {

// ---- guns ----
function firePlayerWeapon(p) {
  const m = muzzlePos(p), a = Math.atan2(m.dy, m.dx), wpn = p.weapon;
  const shot = (ang, spd, kind, dmg, extra) => {
    const s = Object.assign({ kind, x: m.x, y: m.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, dmg, life: 90, r: 2 }, extra || {});
    G.pShots.push(s); return s;
  };
  switch (wpn) {
    case 'P': shot(a, 7.5, 'pb', 1); p.cd = 6; muzzle(m.x, m.y, a, 4); Snd.play('pistol'); break;
    case 'H': shot(a + rnd(-0.05, 0.05), 9, 'hb', 1); p.cd = 4; muzzle(m.x, m.y, a, 6); Snd.play('mg'); shellCasing(p.x, p.y - 17, p.face); break;
    case 'S': for (let i = -2; i <= 2; i++) shot(a + i * 0.14, 6, 'sb', 1.2, { life: 70, r: 3 }); p.cd = 14; muzzle(m.x, m.y, a, 7, '#ffd0ff', '#d050f0'); Snd.play('spread'); break;
    case 'F': {
      const s = shot(a + rnd(-0.08, 0.08), 4.3 + rnd(0.6), 'flame', 0.5, { life: 26, r: 5, pierce: true, hit: [] });
      s.vx += p.vx * 0.5;
      p.cd = 3; Snd.play('flame'); break;
    }
    case 'R': shot(a, 2, 'rocket', 5, { life: 110, r: 3, ang: a }); p.cd = 22; muzzle(m.x, m.y, a, 6); Snd.play('rocket'); smoke(m.x - m.dx * 8, m.y, 2, 0.8); break;
  }

}
function fireLaser(p) {
  const m = muzzlePos(p);
  p.laserT++;
  if (p.laserT % 2 === 0) p.ammo--;
  Snd.play('laser');
  // march the beam until a wall
  let x = m.x, y = m.y, len = 0;
  const step = 4;
  while (len < 360) {
    x += m.dx * step; y += m.dy * step; len += step;
    if (solidAt(x, y)) { hitBreakableAt(x, y, 0.4); break; }
    if (bossBeamStop(x, y)) break;
    if (y < -20 || y > H + 20) break;
  }
  const x1 = x, y1 = y;
  // damage everything along the beam
  for (const e of G.enemies) {
    if (e.dead || !e.active) continue;
    if (segHitsBody(m.x, m.y, x1, y1, e)) { damageEnemy(e, 0.34, { kind: 'laser', x: m.x, vx: m.dx }); if (G.t % 3 === 0) sparks(e.x, e.y - e.h / 2, 1, '#a0f8ff'); }
  }
  for (const pr of G.props) if (pr.shootable && !pr.remove && segHitsBody(m.x, m.y, x1, y1, pr)) hitProp(pr, 0.34, { kind: 'laser' });
  if (G.boss) bossBeamHit(m.x, m.y, x1, y1, 0.34);
  G.fx.push({ kind: 'beam', x0: m.x, y0: m.y, x1, y1, w: 3 + Math.sin(G.t * 0.8), t: 0, max: 1, c1: '#40c8ff', c2: '#ffffff' });
  if (G.t % 2 === 0) { const pp = part('spark', x1, y1, rnd(-1.5, 1.5), rnd(-2, 0), 10, 1, '#a0f8ff'); pp.g = 0.1; }
  if (p.ammo <= 0) { p.weapon = 'P'; p.ammo = Infinity; floatText(p.x, p.y - 36, 'OUT OF AMMO', '#ff9090', 1, 60); }
}
function segHitsBody(x0, y0, x1, y1, e) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 4);

// ---- player projectiles ----
function updatePShots() {

    if (s.kind === 'rocket') {
      const spd = Math.min(7.5, Math.hypot(s.vx, s.vy) + 0.35);
      const tgt = nearestEnemy(s.x, s.y, 220, s.ang);
      if (tgt) {
        const want = Math.atan2(tgt.y - tgt.h / 2 - s.y, tgt.x - s.x);
        let d = want - s.ang; while (d > PI) d -= TAU; while (d < -PI) d += TAU;
        s.ang += clamp(d, -0.07, 0.07);
      }
      s.vx = Math.cos(s.ang) * spd; s.vy = Math.sin(s.ang) * spd;
      if (G.t % 2 === 0) { const p = part('smoke', s.x - s.vx, s.y - s.vy, rnd(-0.2, 0.2), rnd(-0.3, 0), 30, 2, '#9a9098'); p.grow = 0.1; p.alpha = 0.6; }
    }

    if (s.kind === 'flame') { s.vx *= 0.96; s.vy = s.vy * 0.96 - 0.04; s.r += 0.25; }
    s.x += s.vx; s.y += s.vy;
    if (s.life <= 0 || s.x < cx - 30 || s.x > cx + W + 30 || s.y < -40 || s.y > H + 20) { s.remove = true; continue; }
    // walls
    if (solidAt(s.x, s.y)) {
      if (s.kind === 'rocket' || s.kind === 'cshell') { explodeAt(s.x - s.vx, s.y - s.vy, s.kind === 'cshell' ? 36 : 28, s.kind === 'cshell' ? 10 : 6, 'p'); }

      else { hitBreakableAt(s.x, s.y, 0.1); }
      s.remove = true; continue;
    }
    // enemies
    let hitSomething = false;
    for (const e of G.enemies) {
      if (e.dead || !e.active || e.ghost) continue;
      if (!pointInBody(s.x, s.y, e, s.r)) continue;
      if (s.pierce) {
        if (s.hit.indexOf(e) >= 0) continue;
        s.hit.push(e);
      }
      if (s.kind === 'rocket' || s.kind === 'cshell') {
        damageEnemy(e, s.kind === 'cshell' ? 8 : 4, { kind: 'rocket', x: s.x, vx: s.vx });
        explodeAt(s.x, s.y, s.kind === 'cshell' ? 36 : 28, s.kind === 'cshell' ? 8 : 5, 'p');
      } else {

    if (G.boss && bossShotHit(s)) { s.remove = true; continue; }

}
function nearestEnemy(x, y, range, ang) {

function explodeAt(x, y, r, dmg, owner, opts) {

    for (let ty = Math.floor((y - r) / TS); ty <= Math.floor((y + r) / TS); ty++)
      for (let tx = Math.floor((x - r) / TS); tx <= Math.floor((x + r) / TS); tx++) {
        const pr = BRK[ty * LW + tx];
        if (pr && !pr.remove && tx >= 0 && tx < LW && ty >= 0 && ty < LH) hitProp(pr, dmg, { kind: 'blast', x, y });
      }
    if (G.boss) bossBlastHit(x, y, r, dmg);

// ----------------------------------------------------------------- update / draw all
function updateEnemies() {
  const cx = G.cam.x;
  for (let i = 0; i < G.enemies.length; i++) {
    const e = G.enemies[i];
    if (!e.active) {
      if (e.x < cx + W + 24 && e.x > cx - 80) e.active = true;
      else continue;
    }
    if (e.flash > 0) e.flash--;
    if (e.hurtT > 0) e.hurtT--;
    const T = ETYPES[e.type];
    if (e.dead) { (T.dieUpdate || updateHumanDeath)(e); continue; }
    T.update(e);
    if (G.cam.lock !== null && e.wave && e.human) e.x = clamp(e.x, cx - 30, cx + W + 30);
    if (!e.wave && e.x < cx - 100) e.remove = true;
    if (e.y > H + 40) e.remove = true;
  }
  sweep(G.enemies);
}
function drawEnemies(x0, x1) {
  for (const e of G.enemies) {
    if (!e.active || e.x < x0 - 60 || e.x > x1 + 60) continue;
    ETYPES[e.type].draw(e);
  }
}

// ----------------------------------------------------------------- enemy projectiles
function updateEShots() {
  const cx = G.cam.x, t = pTarget(), alive = targetAlive();
  for (const s of G.eShots) {
    s.life--;
    if (s.kind === 'egren') {
      s.vy += 0.2; s.rot++;
      s.x += s.vx; if (solidAt(s.x, s.y)) { s.x -= s.vx; s.vx *= -0.4; }
      s.y += s.vy;
      if (s.vy > 0 && groundBelow(s.x, s.y) && (s.y - s.vy) <= Math.floor(s.y / TS) * TS + 0.5) { s.y = Math.floor(s.y / TS) * TS - 0.5; s.vy *= -0.4; s.vx *= 0.6; if (Math.abs(s.vy) < 0.6) s.vy = 0; else Snd.play('bounce'); }
      else if (solidAt(s.x, s.y)) { s.y -= s.vy; s.vy = 0; }
      if (s.life <= 0 || (alive && pointInBody(s.x, s.y, t, 2))) { explodeAt(s.x, s.y - 4, 26, 3, 'e'); s.remove = true; }
      continue;
    }
    if (s.kind === 'bomb') {
      s.vy = Math.min(s.vy + 0.16, 5); s.x += s.vx; s.y += s.vy;
      if (groundBelow(s.x, s.y) || (alive && pointInBody(s.x, s.y, t, 3)) || s.life <= 0) { explodeAt(s.x, s.y - 4, 22, 3, 'e'); s.remove = true; }
      continue;
    }
    if (s.kind === 'bshell' || s.kind === 'missile') { updateBossProjectile(s); continue; }
    if (s.g) s.vy += s.g;
    s.x += s.vx; s.y += s.vy;
    if (s.life <= 0 || s.x < cx - 40 || s.x > cx + W + 40 || s.y < -60 || s.y > H + 20) { s.remove = true; continue; }
    if (solidAt(s.x, s.y)) { sparks(s.x, s.y, 2, '#ff8040'); s.remove = true; continue; }
    if (alive && pointInBody(s.x, s.y, t, s.r)) {
      if (hurtPlayer(s, s.kind === 'ebb' ? 1 : 1)) { sparks(s.x, s.y, 4, '#ffb040'); s.remove = true; }
    }
  }
  sweep(G.eShots);
}
function drawEShots() {
  for (const s of G.eShots) {
    const x = Math.round(s.x), y = Math.round(s.y);
    switch (s.kind) {
      case 'eb': case 'snipe':
        dcirc(x, y, 3, OUTLINE); dcirc(x, y, 2, s.kind === 'snipe' ? '#ff3030' : '#ff7a20'); ctx.fillStyle = '#fff4c0'; ctx.fillRect(x - 1, y - 1, 2, 2);
        break;
      case 'ebb':
        dcirc(x, y, 5, OUTLINE); dcirc(x, y, 4, (G.t >> 2) % 2 ? '#ff40a0' : '#ff80c0'); dcirc(x, y, 2, '#ffffff');
        break;
      case 'egren': case 'bomb':
        ctx.fillStyle = OUTLINE; ctx.fillRect(x - 3, y - 3, 6, 7);
        ctx.fillStyle = s.kind === 'bomb' ? '#3a3a42' : '#6a5a3a'; ctx.fillRect(x - 2, y - 2, 4, 5);
        ctx.fillStyle = (s.life >> 2) % 2 ? '#ff3030' : '#ffe040'; ctx.fillRect(x, y - 3, 1, 1);
        break;
      default: drawBossProjectile(s);
    }
  }
}

// =====================================================================
//  PROPS, CAPTIVES, PICKUPS, HAZARDS
// =====================================================================
function regTiles(p, tx, ty, w, h) {
  p.tiles = [];
  for (let y = ty; y < ty + h; y++) for (let x = tx; x < tx + w; x++) {
    setTile(x, y, T_BREAK); BRK[y * LW + x] = p; p.tiles.push(y * LW + x);
  }
}
function clearTiles(p) {
  if (!p.tiles) return;
  for (const i of p.tiles) { if (tiles[i] === T_BREAK) tiles[i] = T_EMPTY; BRK[i] = null; }
  p.tiles = null;
}
function mkProp(type, x, y, o) {
  const p = Object.assign({ kind: 'prop', type, x, y, w: 16, h: 16, hp: 3, flash: 0, t: 0, shootable: false, blastable: false }, o || {});
  delete p.k;
  const tx = Math.floor(x / TS), ty = Math.round(y / TS);
  switch (type) {
    case 'crate': p.hp = 3; regTiles(p, tx, ty, 1, 1); p.y = (ty + 1) * TS; break;
    case 'sandbag': p.hp = 10; p.w = 32; regTiles(p, tx, ty, 2, 1); p.x = tx * TS + 16; p.y = (ty + 1) * TS; break;
    case 'crackwall': p.hp = 6; p.h = (o.h || 2) * TS; regTiles(p, tx, ty, 1, o.h || 2); p.y = (ty + (o.h || 2)) * TS; break;
    case 'crackfloor': p.hp = 5; p.w = (o.w || 2) * TS; regTiles(p, tx, ty, o.w || 2, 1); p.x = tx * TS + p.w / 2; p.y = (ty + 1) * TS; break;
    case 'bwall': p.hp = 999; p.invuln = true; p.h = o.h * TS; regTiles(p, tx, ty, 1, o.h); p.y = (ty + o.h) * TS; p.tx = tx; break;
    case 'barrel': p.hp = 3; p.w = 12; p.h = 16; p.shootable = true; p.blastable = true; p.vx = 0; p.vy = 0; break;
    case 'captive': p.w = 12; p.h = 20; p.shootable = true; p.blastable = true; p.state = 'tied'; p.vx = 0; p.vy = 0; p.face = 1; p.t = rndi(0, 150); break;
    case 'stalactite': p.anchor = y; p.y = y + 16; p.w = 10; p.h = 16; p.hp = 1; p.shootable = true; p.state = 'hang'; p.vy = 0; break;
    case 'rock': p.anchor = y; p.y = y + 12; p.w = 12; p.h = 12; p.hp = 1; p.state = 'shake'; p.vy = 0; break;
    case 'fakewall': p.x0 = tx * TS; p.y0 = ty * TS; p.pw = o.w * TS; p.ph = o.h * TS; p.alpha = 1; p.cv = makeFakeWallCanvas(p.pw, p.ph, o.style || 'rock'); break;
    case 'secret': p.x0 = tx * TS; p.pw = o.w; break;

// shared queries used by player projectiles
function bossShotHit(s) {

  for (const k in b.parts) {
    const p = b.parts[k];
    if (!p.alive || k === 'core') continue;

function bossPointHit(x, y) { const b = G.boss; return b && !b.gone && b.state !== 'dead' && inHull(b, x, y + 2); }
function bossBlastHit(x, y, r, dmg) {

    const p = b.parts[k];

function bossBeamHit(x0, y0, x1, y1, dmg) {

      fr(-12, -24, 14, 5, '#5a5e6a'); fr(18, -8, 10, 10, '#e8c030'); fr(20, -6, 6, 6, '#2a2020');

function drawBoss(b) {
  if (b.gone) { drawBossWreck(b); return; }

  const dyingFlash = b.state === 'dying' && (T >> 2) % 3 === 0 ? '#ffffff' : null;
  const shk = b.state === 'dying' ? rndi(-1, 1) : 0;
  // tail (behind hull)

    const hx = P.tail.ax, hy = P.tail.ay + 10;
    const cxp = Math.min(215, (TAIL_BASE.x + hx) / 2 + 40), cyp = Math.min(-190, hy - 80);
    for (let i = 0; i <= 9; i++) {
      const k = i / 9, it = 1 - k;
      const sx = it * it * TAIL_BASE.x + 2 * it * k * cxp + k * k * hx, sy = it * it * TAIL_BASE.y + 2 * it * k * cyp + k * k * hy;
      const s = Math.round(16 - k * 6);

  }

  for (let k = 0; k < 17; k++) {

    fr(Math.min(lx, 200), -38, 5, 3, '#4a4650'); fr(Math.min(206 - lx + 8, 200), -2, 5, 2, '#4a4650');
  }
  // lower hull

  for (let i = 0; i < 16; i++) fr(12 + i * 12, -47, 6, 6, i % 2 ? '#e8c030' : '#2a2020');
  for (let i = 0; i < 12; i++) fr(30 + i * 15, -74, 2, 2, '#c86a4a');
  fr(-4, -86, 28, 52, '#5a1e1c'); fr(-4, -86, 28, 3, '#8a3630');
  // cab
  fr(28, -124, 152, 44, '#8a3630'); fr(28, -124, 152, 4, '#b0503e'); fr(28, -84, 152, 3, '#5a1e1c');
  fr(40, -114, 54, 8, '#1a1016');
  const eye = b.state === 'roar' || b.state === 'rage' ? ((T >> 2) % 2 ? '#ffffff' : '#ff3020') : '#ff3020';
  fr(44, -113, 12, 5, eye); fr(70, -113, 12, 5, eye); fr(44, -113, 12, 1, '#1a1016'); fr(70, -109, 12, 1, '#1a1016');
  fr(116, -114, 16, 12, '#e8e0d0'); fr(118, -111, 4, 4, '#1a1016'); fr(126, -111, 4, 4, '#1a1016'); fr(118, -104, 12, 4, '#e8e0d0'); fr(120, -103, 1, 3, '#1a1016'); fr(124, -103, 1, 3, '#1a1016'); fr(128, -103, 1, 3, '#1a1016');
  fr(150, -148, 11, 28, '#3a3036'); fr(148, -150, 15, 4, '#5a5058'); fr(166, -140, 9, 20, '#3a3036'); fr(164, -142, 13, 4, '#5a5058');
  // front vent (flame thrower) glow
  fr(-6, -28, 8, 12, '#3a3a40');
  // scorch marks as it gets damaged

  // core shutter
  const sh = b.shutter;
  const shOpen = Math.round(sh * 12);

  }
  for (const k of ['upper', 'lower']) {
    const q = P[k];
    if (!q.alive) continue;
    let fl = dyingFlash || (q.flash > 0 ? '#ffffff' : null);
    const tele = b.atk === 'guns' && ((k === 'lower' && b.atkT < 30) || (k === 'upper' && b.atkT > 85 && b.atkT < 110));

const DIFF = [0.8, 1.0, 1.15, 1.25], CDMUL = [1.35, 1.1, 0.95, 0.85], BSPD = [2.1, 2.4, 2.7, 2.9];

let titleCam = 0;

function newGame() {
  Object.assign(G, { nextLife: 25000, score: 0, lives: 3, rescued: 0, secrets: 0, foundSecrets: [], livesLost: 0, continues: 0, kills: 0, checkpoint: null, missionT: 0 });
  startLevel(null);
}
function startLevel(cp) {
  buildLevel();
  G.enemies = []; G.pShots = []; G.eShots = []; G.pickups = []; G.props = []; G.fx = []; G.texts = []; G.msgs = []; G.spawnQ = [];
  PARTS.length = 0; BIRDS.length = 0;

  G.levelW = LW * TS;
  G.cam.x = cp ? clamp(cp.x - 120, 0, G.levelW - W) : 0;
  G.cam.lock = null; G.cam.shake = 0;
  G.totalCaptives = LEVEL.specs.filter(s => s.k === 'captive').length;
  G.totalSecrets = 3;
  const enemyKinds = { soldier: 1, rusher: 1, sniper: 1, heavy: 1, gunner: 1, bomber: 1, carrier: 1, drone: 1, turret: 1 };
  for (const s of LEVEL.specs) {
    if (cp) {
      if (enemyKinds[s.k] && s.x < G.cam.x + W + 8) continue;
      if ((s.k === 'captive' || s.k === 'item' || s.k === 'tank' || s.k === 'stalactite') && s.x < cp.x - 8) continue;
      if (s.k === 'secret' && G.foundSecrets.indexOf(s.id) >= 0) continue;
    }
    spawnSpec(s, cp);
  }
  G.events = LEVEL.events.slice().sort((a, b) => a.cx - b.cx).map(e => Object.assign({}, e, { done: !!cp && e.cx < G.cam.x + 4 }));
  prerenderLevel();
  const p = G.player = makePlayer(cp ? cp.x : 60, 0);
  if (cp) {
    Object.assign(G, { score: cp.score, rescued: cp.rescued, secrets: cp.secrets, foundSecrets: cp.found.slice(), lives: 3, nextLife: (Math.floor(cp.score / 25000) + 1) * 25000 });
    G.checkpoint = cp;
    respawnPlayer(p, cp.x);
    showMsg('CONTINUE!', { scale: 3, life: 90, y: 90 });
    Music.play('stage');
  } else {
    p.state = 'intro'; p.hidden = true; p.x = -50; p.y = 40;
    G.heli = { x: -70, y: 46, t: 0, dropped: false };
    Music.play('stage');

}
function spawnSpec(s, cp) {
  switch (s.k) {
    case 'soldier': case 'rusher': case 'sniper': case 'heavy': case 'gunner': case 'bomber': case 'carrier':
      G.enemies.push(mkEnemy(s.k, s.x, s.y, { idle: s.idle, face: s.face || -1, state: 'idle' })); break;
    case 'drone': G.enemies.push(mkEnemy('drone', s.x, s.y, { state: 'hover', seed: rnd(TAU) })); break;
    case 'turret': G.enemies.push(mkEnemy('turret', s.x, s.ceiling ? s.y + 12 : s.y, { ceiling: !!s.ceiling, ang: s.ceiling ? PI / 2 : PI })); break;
    case 'tank': G.tank = makeTank(s.x, s.y); break;
    case 'item': spawnPickup(s.item, s.x, s.y); break;
    case 'checkpoint': {
      const pr = mkProp('checkpoint', s.x, s.y, s);
      if (cp && s.id <= cp.id) { pr.raised = true; pr.flag = 1; }
      G.props.push(pr); break;

}
function saveCheckpoint(pr) {
  const p = G.player;
  if (p.hp < p.maxHp) { p.hp = p.maxHp; floatText(p.x, p.y - 44, 'HEALTH FULL!', '#ff8080', 1, 60); }
  G.checkpoint = { id: pr.id, x: pr.x, score: G.score, rescued: G.rescued, secrets: G.secrets, found: G.foundSecrets.slice() };
}

// ---------------------------------------------------------------------
//  Camera, events, waves
// ---------------------------------------------------------------------
function updateCamera() {
  const c = G.cam, t = pTarget();
  const maxX = G.levelW - W;
  if (c.lock !== null) {
    if (c.x < c.lock) c.x = Math.min(c.lock, c.x + 3); else c.x = c.lock;
  } else if (G.player.state !== 'dead') {
    const target = t.x - W * 0.4;
    if (target > c.x) c.x += Math.min((target - c.x) * 0.14, 6);
  }
  c.x = clamp(c.x, 0, maxX);
}
function updateShake() {
  const c = G.cam;
  c.shake *= 0.86; if (c.shake < 0.3) c.shake = 0;
  c.sx = c.shake ? rnd(-1, 1) * c.shake : 0; c.sy = c.shake ? rnd(-1, 1) * c.shake * 0.7 : 0;
}
function updateEvents() {
  for (const ev of G.events) {
    if (ev.done) continue;
    if (G.cam.x < ev.cx) break;
    if (G.cam.lock !== null && !ev.boss) break;
    ev.done = true;
    if (ev.lock) {
      G.cam.lock = ev.cx; G.wave = { ev, idx: 0, t: 0 };
      startWave();
      break;
    } else if (ev.spawn) {
      for (const s of ev.spawn) G.spawnQ.push(Object.assign({}, s, { at: G.t + (s.d || 0) }));
    } else if (ev.msg) {
      showMsg(ev.msg, { sub: ev.sub, color: ev.col || GRAD_GOLD, scale: 3, life: 140, y: 70, subColor: '#ffffff' });
      if (ev.col) Snd.play('alarm');
    } else if (ev.rockfall) {
      G.rockfall = ev.rockfall;
      showMsg('ROCKSLIDE!', { color: GRAD_RED, scale: 2, life: 80, y: 90 });
    } else if (ev.boss) startBossFight();
  }
}
function startWave() {
  const w = G.wave, list = w.ev.waves[w.idx];
  w.t = 0;
  for (const s of list) G.spawnQ.push(Object.assign({}, s, { at: G.t + (s.d || 0) + 25, wave: true }));
}
function updateWave() {
  const w = G.wave;
  if (!w) return;
  w.t++;
  for (const e of G.enemies) {
    if (!e.wave || e.dead) continue;
    if (!onScreen(e, 50) && e.state !== 'enter') { e.offT = (e.offT || 0) + 1; if (e.offT > 300) e.remove = true; } else e.offT = 0;
  }
  const pending = G.spawnQ.some(s => s.wave);
  const alive = G.enemies.some(e => e.wave && !e.dead && !e.remove);
  if (w.t > 2700) for (const e of G.enemies) if (e.wave && !e.dead) { e.wave = false; if (!onScreen(e)) e.remove = true; }
  if (!pending && !alive && w.t > 30) {
    w.idx++;
    if (w.idx >= w.ev.waves.length) {
      G.wave = null; G.cam.lock = null; G.goArrow = 200;
      Snd.play('go');
      addScore(1000);
      floatText(G.player.x, G.player.y - 44, 'AREA CLEAR +1000', '#80ff80', 1, 70);
    } else startWave();
  }
}
function updateSpawnQ() {
  for (const s of G.spawnQ) {
    if (G.t < s.at) continue;
    if (s.from === 'P') {
      // paratroopers are carried in by a transport helicopter and jump when it is overhead
      const d = G.dropship || (G.dropship = { x: G.cam.x + W + 70, y: 54, t: 0 });
      if (d.x > G.cam.x + s.ox) continue;
      s.dropY = d.y + 6;
    }
    spawnFromEvent(s); s.remove = true;
  }
  sweep(G.spawnQ);
}
function updateDropship() {
  const d = G.dropship;
  if (!d) return;
  d.t++; d.x -= 3.2; d.y = 54 + Math.sin(d.t * 0.08) * 2;
  if (G.t % 5 === 0) Snd.play('helicopter');
  if (d.x < G.cam.x - 90 && !G.spawnQ.some(s => s.from === 'P')) G.dropship = null;
}
function spawnFromEvent(s) {
  const cx = G.cam.x;
  let e;
  if (s.t === 'truck') e = mkEnemy('truck', cx + W + 50, groundYAt(cx + W + 50), { n: s.n || 3 });
  else if (s.t === 'jeep') e = mkEnemy('jeep', cx + W + 40, groundYAt(cx + W + 40));
  else if (s.t === 'drone') {
    const ty = rnd(50, 100);
    e = mkEnemy('drone', cx + W + 16, ty, { state: 'enter', tx: cx + rnd(180, 400), ty, seed: rnd(TAU) });
  } else {
    let x, y, state = 'runin';
    const o = {};
    if (s.from === 'R') { x = cx + W + 14; y = groundYAt(x); o.tx = cx + W - rnd(50, 170); }
    else if (s.from === 'L') { x = cx - 14; y = groundYAt(x); o.tx = cx + rnd(40, 150); o.face = 1; }
    else if (s.from === 'P') { x = cx + s.ox; y = s.dropY || 48; state = 'para'; }
    else if (s.from === 'W') { x = s.wx; y = s.wy; state = 'window'; o.face = -1; }
    else { x = s.x; y = s.y; o.tx = x - rnd(50, 90); }
    o.state = state;
    e = mkEnemy(s.t, x, y, o);
    if (s.burst) burstWall(s.burst, e);
  }
  e.active = true; e.wave = !!s.wave;
  G.enemies.push(e);
}
function burstWall(tx, e) {
  for (const pr of G.props) if (pr.type === 'bwall' && pr.tx === tx && !pr.remove) { pr.invuln = false; destroyProp(pr, { kind: 'blast' }); }
  bubble(e, pick(['SURPRISE!', 'KNOCK KNOCK!', 'HERE\'S JOHNNY!']), 50);
  hitStop(4);
}
function updateRockfall() {
  if (G.rockfall <= 0) return;
  G.rockfall--;
  if (G.rockfall % 34 === 0) {
    const t = pTarget();
    const x = clamp(t.x + rnd(-50, 120), G.cam.x + 20, G.cam.x + W - 20);
    G.props.push(mkProp('rock', x, ceilBottom(x)));
  }
}

//  Intro / ending / game over
// ---------------------------------------------------------------------
function updateIntro() {
  const h = G.heli, p = G.player;
  if (!h) return;
  h.t++; h.x += h.dropped ? 2.4 : 2.2; h.y = 46 + Math.sin(h.t * 0.06) * 3 - (h.dropped ? h.t * 0.1 : 0);
  if (G.t % 5 === 0) Snd.play('helicopter');
  if (!h.dropped && h.x >= 100) {
    h.dropped = true; h.t = 0;
    p.hidden = false; p.x = h.x; p.y = h.y + 8; p.vy = 0; p.vx = 0.6;
    bubble(p, 'GERONIMO!', 40);
  }
  if (h.dropped && p.state === 'intro' && p.onGround) {
    p.state = 'normal'; dust(p.x, p.y, 8); Snd.play('land'); shake(2);
    showMsg('MISSION START!', { sub: 'RESCUE THE CAPTIVES - DESTROY THE IRON SCORPION', scale: 3, life: 150, y: 70, subColor: '#ffe080' });
    G.goArrow = 160;
  }
  if (h.x > G.cam.x + W + 100) G.heli = null;
}
function startEndSequence() {
  const p = G.player;
  if (G.tank && G.tank.occupied) exitTank(G.tank, false);
  G.endSeq = { t: 0 };
  for (const e of G.enemies) if (!e.dead) killEnemy(e, { kind: 'blast', x: e.x });
  G.eShots.length = 0;
  p.state = 'victory'; p.inv = 0; p.vx = 0;
  Music.play('victory');
  showMsg('MISSION COMPLETE!', { scale: 3, life: 300, y: 70, color: GRAD_GOLD, sub: 'THE IRON SCORPION IS SCRAP METAL!' });
}
function updateEndSequence() {
  const s = G.endSeq, p = G.player;
  s.t++;
  if (s.t % 45 === 0) confetti(G.cam.x + rnd(40, W - 40), rnd(20, 80), 16);
  if (p.onGround && s.t % 50 === 10) { p.vy = -3.5; Snd.play('jump'); }
  if (s.t === 60) bubble(p, pick(['PIECE OF CAKE!', 'WHO\'S NEXT?!', 'BANDANA POWER!']), 80);
  if (s.t > 330) toComplete();
}
function startGameOver() {
  G.scene = 'gameover'; G.goT = 0; G.contT = 10 * 60 - 1;
  Music.play('gameover');
  saveHi();
}
function saveHi() { if (G.score > G.hi) { G.hi = G.score; store.set('hi', G.hi); } }
function toComplete() {
  const rows = [
    ['MISSION SCORE', '', G.score],
    ['CAPTIVES RESCUED', G.rescued + '/' + G.totalCaptives, G.rescued * 1000],
    ['SECRETS FOUND', G.secrets + '/' + G.totalSecrets, G.secrets * 2000],
    ['LIVES REMAINING', '' + G.lives, G.lives * 3000],
    ['NO-CONTINUE BONUS', G.continues ? 'NO' : 'YES', G.continues ? 0 : 10000]
  ];
  const total = rows.reduce((a, r) => a + r[2], 0);
  const pts = (G.rescued / G.totalCaptives) * 40 + (G.secrets / G.totalSecrets) * 20 + Math.max(0, 25 - G.livesLost * 7) + (G.continues ? 0 : 15);
  const rank = pts >= 88 ? 'S' : pts >= 70 ? 'A' : pts >= 50 ? 'B' : pts >= 30 ? 'C' : 'D';
  G.tally = { rows, total, rank, t: 0, shown: 0, counts: rows.map(() => 0), totalShown: 0 };
  G.score = total;
  saveHi();
  G.scene = 'complete';
}

// ---------------------------------------------------------------------
//  UPDATE per scene
// ---------------------------------------------------------------------
function tick() {
  Input.poll();
  if (Input.pressed('mute')) { Snd.setMute(!Snd.muted); G.toast = { text: Snd.muted ? 'SOUND OFF' : 'SOUND ON', t: 70 }; }
  if (G.toast && --G.toast.t <= 0) G.toast = null;
  switch (G.scene) {
    case 'title': tickTitle(); break;
    case 'starting': if (++G.startT > 50) newGame(); break;
    case 'play': tickPlay(); break;
    case 'pause': tickPause(); break;
    case 'gameover': tickGameOver(); break;
    case 'complete': tickComplete(); break;
  }
  Input.taps.length = 0;
  G.frame++;
}
function tickTitle() {
  titleCam += 0.5;
  if (titleCam > 1500) titleCam = 0;
  updateBirds(titleCam);
  if (Snd.ctx && !Music.cur && !G.titleMusicDone) { Music.play('title'); G.titleMusicDone = true; }
  G.t++;
  updateParts(); updateFx();
  if (G.frame % 90 === 0) spawnBoom(titleCam + rnd(30, 450), rnd(150, 200), rnd(14, 26), { silent: true });
  if (Input.pressed('start') || Input.pressed('jump') || Input.pressed('fire') || Input.taps.length) {
    Snd.unlock();
    Music.stop(); Music.play('jingle');
    Snd.play('select');
    G.scene = 'starting'; G.startT = 0;
  }
}
function tickPlay() {
  if ((Input.pressed('pause') || Input.pressed('start')) && !G.endSeq) { G.scene = 'pause'; G.menu = 0; Music.duck(true); Snd.play('select'); return; }
  if (G.flash > 0) G.flash--;
  updateShake();
  if (G.hitStop > 0) { G.hitStop--; return; }
  G.t++; G.missionT++;
  const z = zoneAt(G.cam.x + W / 2);
  G.zone = z; G.diff = DIFF[z]; G.cdMul = CDMUL[z]; G.bulletSpd = BSPD[z];
  updateSpawnQ(); updateEvents(); updateWave(); updateRockfall();
  updatePlayer(G.player);
  if (G.tank) updateTank(G.tank);
  updateEnemies();
  if (G.boss) updateBoss(G.boss);
  updatePShots(); updateEShots();
  updateProps(); updatePickups();
  updateParts(); updateFx(); updateTexts(); updateMsgs();
  updateBirds(G.cam.x);
  updateIntro();
  updateDropship();
  if (G.score >= G.nextLife) { G.nextLife += 25000; G.lives = Math.min(9, G.lives + 1); floatText(G.player.x, G.player.y - 44, '1UP!', '#80ff80', 2, 80); Snd.play('checkpoint'); }
  if (G.endSeq) updateEndSequence();
  updateCamera();
  if (G.goArrow > 0) G.goArrow--;
}
const PAUSE_ITEMS = ['RESUME', 'RESTART CHECKPOINT', 'SOUND', 'QUIT TO TITLE'];
function tickPause() {
  G.t2 = (G.t2 || 0) + 1;
  let choose = -1;
  if (Input.pressed('up')) { G.menu = (G.menu + 3) % 4; Snd.play('move'); }
  if (Input.pressed('down')) { G.menu = (G.menu + 1) % 4; Snd.play('move'); }
  if (Input.pressed('jump') || Input.pressed('fire') || Input.pressed('start')) choose = G.menu;
  if (Input.pressed('pause')) choose = 0;
  for (const t of Input.taps) {
    for (let i = 0; i < 4; i++) if (Math.abs(t.y - (118 + i * 18)) < 9 && Math.abs(t.x - W / 2) < 110) choose = i;
    if (t.x > 440 && t.y < 60) choose = 0;
  }
  if (choose < 0) return;
  Snd.play('select');
  switch (choose) {
    case 0: G.scene = 'play'; Music.duck(false); Input.clear(); break;
    case 1: Music.duck(false); G.continues++; startLevel(G.checkpoint); if (!G.checkpoint) { G.score = 0; G.rescued = 0; G.secrets = 0; G.foundSecrets = []; } break;
    case 2: Snd.setMute(!Snd.muted); break;
    case 3: Music.duck(false); Music.stop(); saveHi(); G.scene = 'title'; G.titleMusicDone = false; break;
  }
}
function tickGameOver() {
  G.goT++;
  G.t++;
  updateParts(); updateFx();
  if (G.contT > 0) {
    G.contT--;
    if (G.goT > 30 && (Input.pressed('fire') || Input.pressed('jump'))) { G.contT = Math.max(0, G.contT - 60); Snd.play('move'); }
    if (G.goT > 20 && (Input.pressed('start') || Input.taps.length)) {
      G.continues++;
      Snd.play('select');
      startLevel(G.checkpoint);
      if (!G.checkpoint) { G.score = 0; G.rescued = 0; G.secrets = 0; G.foundSecrets = []; }
      return;
    }
    if (G.contT % 60 === 59) Snd.play('beep');
  } else {
    if (++G.goFinal > 200 || (G.goFinal > 40 && Input.anyPressed())) { G.scene = 'title'; G.titleMusicDone = false; Music.stop(); }
    return;
  }
  G.goFinal = 0;
}
function tickComplete() {
  const T = G.tally;
  T.t++;
  G.t++;
  updateParts();
  if (T.t % 50 === 0) confetti(rnd(40, W - 40), -5, 12);
  const step = 45;
  const idx = Math.floor((T.t - 30) / step);
  if (idx >= 0 && idx < T.rows.length) {
    T.shown = idx + 1;
    const r = T.rows[idx], k = Math.min(1, ((T.t - 30) % step) / 30);
    T.counts[idx] = Math.round(r[2] * k);
    if (T.t % 3 === 0 && k < 1) Snd.play('tally');
  }
  if (idx >= T.rows.length) {
    for (let i = 0; i < T.rows.length; i++) T.counts[i] = T.rows[i][2];
    T.totalShown = Math.min(T.total, T.totalShown + Math.ceil(T.total / 40));
    if (T.totalShown < T.total && T.t % 3 === 0) Snd.play('tally');
  }
  const rankT = 30 + T.rows.length * step + 60;
  if (T.t === rankT) { Snd.play('stamp'); shake(10); G.cam.shake = 10; }
  updateShake();
  if (T.t > rankT + 40 && (Input.anyPressed() || Input.taps.length)) { G.scene = 'title'; G.titleMusicDone = false; Music.stop(); Snd.play('select'); }
}

// ---------------------------------------------------------------------

// ---------------------------------------------------------------------
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  switch (G.scene) {
    case 'title': case 'starting': renderTitle(); break;
    case 'play': renderWorld(); renderHUD(); break;
    case 'pause': renderWorld(); renderHUD(); renderPause(); break;
    case 'gameover': renderWorld(); renderGameOver(); break;
    case 'complete': renderComplete(); break;
  }
  if (G.toast) drawText(G.toast.text, W - 6, H - 14, '#ffffff', 1, 2);
  drawTouch();
}
function renderWorld() {
  const cx = Math.round(G.cam.x), sx = Math.round(G.cam.sx), sy = Math.round(G.cam.sy);
  drawBackgrounds(cx);
  ctx.setTransform(1, 0, 0, 1, -cx + sx, sy);

  drawPlayer(G.player);
  drawPShots();
  drawEShots();
  drawFx();
  drawParts(x0, x1);

}
function drawPlayer(p) {
  if (!p || p.state === 'tank' || p.hidden) return;
  if (p.state === 'dead') {
    const lying = p.rot % 2 === 1;
    drawHuman(p.x, p.y + (lying && p.onGround ? 8 : 0), p.face, ST.player, { leg: 'fall', arm: 'panic', face: 'dead' }, null, p.rot);
    return;
  }
  if (p.inv > 0 && p.state === 'normal' && (G.t >> 2) % 2 && p.hurtT <= 0) return;
  let pose;
  if (p.state === 'victory') {
    pose = { leg: p.onGround ? 'stand' : 'jump', arm: 'fist', face: 'grin', wind: true };
    if (G.endSeq && G.endSeq.t % 100 > 70) pose.arm = 'salute';
  } else if (p.state === 'intro') pose = { leg: 'fall', arm: 'panic', face: 'shout', wind: true };
  else pose = playerPose(p);
  drawHuman(p.x, p.y, p.face, ST.player, pose, p.hurtT > 12 ? '#ffffff' : null);
  if (p.shield > 0 && (p.shield > 120 || (G.t >> 2) % 2)) {
    ctx.globalAlpha = 0.25 + Math.sin(G.t * 0.2) * 0.08;
    dcirc(p.x, p.y - p.h / 2 - 1, 18, '#60b0ff');
    ctx.globalAlpha = 0.8;
    ring(p.x, p.y - p.h / 2 - 1, 18, '#b0e0ff', 1);
    ctx.globalAlpha = 1;
  }
}
function updateMsgs() { for (const m of G.msgs) { m.t++; if (m.t > m.life) m.remove = true; } sweep(G.msgs); }
function drawMsgs() {
  for (const m of G.msgs) {
    const k = Math.min(1, m.t / 10), off = Math.round((1 - k) * (1 - k) * W * 0.8);
    if (m.life - m.t < 20 && (m.t >> 1) % 2) continue;
    drawText(m.text, W / 2 + off, m.y + Math.round(Math.sin(m.t * 0.15) * 1.5), m.color, m.scale, 1);
    if (m.sub) drawText(m.sub, W / 2 - off, m.y + 8 * m.scale + 5, m.subColor, 1, 1);
  }
}

function renderTitle() {
  const cx = Math.round(titleCam);
  drawBackgrounds(cx);
  ctx.setTransform(1, 0, 0, 1, -cx, 0);
  ctx.drawImage(fgCanvas, cx, 0, W, LH * TS, cx, 0, W, LH * TS);

  drawFgSilhouettes(cx);

  grd.addColorStop(0, 'rgba(10,4,20,0.55)'); grd.addColorStop(0.5, 'rgba(10,4,20,0.15)'); grd.addColorStop(1, 'rgba(10,4,20,0.75)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  // animated logo: letters drop in and bob
  const T = G.frame;
  const word1 = 'BANDANA', word2 = 'BLITZ!';
  const drawWord = (w, y, sc, col, delay) => {
    const tw = w.length * 6 * sc;
    for (let i = 0; i < w.length; i++) {
      const lt = T - delay - i * 5;
      if (lt < 0) continue;
      const drop = lt < 20 ? (1 - lt / 20) * (1 - lt / 20) * -120 : 0;
      const bob = Math.round(Math.sin(T * 0.06 + i * 0.7) * 2);
      drawText(w[i], W / 2 - tw / 2 + i * 6 * sc, y + drop + bob, col, sc, 0);
    }
  };
  drawWord(word1, 26, 6, GRAD_GOLD, 0);
  drawWord(word2, 76, 6, GRAD_RED, 40);
  // shine sweep
  const sh = (T * 4) % 900 - 200;
  if (sh > 60 && sh < 420) { ctx.globalAlpha = 0.35; ctx.fillStyle = '#ffffff'; ctx.save(); ctx.beginPath(); ctx.rect(60, 26, 360, 100); ctx.clip(); ctx.translate(sh, 0); ctx.rotate(0.35); ctx.fillRect(0, -40, 10, 220); ctx.restore(); ctx.globalAlpha = 1; }
  if (T > 80) drawText('OPERATION: SANDSTORM', W / 2, 128, '#ffe8c0', 1, 1);
  // hero posing
  const hx = 50, hy = 262;
  ctx.save(); ctx.translate(hx, hy); ctx.scale(3, 3);
  const firing = T % 120 < 24;
  drawHuman(0, 0, 1, ST.player, { leg: 'stand', arm: 'gun', gun: 'hmg', aim: firing ? -0.2 : -0.35, face: firing ? 'shout' : 'grin', wind: true, bob: (T >> 4) % 2 ? -1 : 0 }, null);
  if (firing && T % 4 < 2) { const g = armGeom(ST.player, { leg: 'stand', aim: -0.2, gun: 'hmg' }); dcirc(g.mx + 2, g.my, 3, '#ffe060'); dcirc(g.mx + 2, g.my, 1.5, '#ffffff'); }
  ctx.restore();
  // soldier running scared on the right
  const rx = 520 - (T * 1.3) % 640;
  ctx.save(); ctx.translate(rx, 266); ctx.scale(2, 2);
  drawHuman(0, 0, -1, ST.soldier, { leg: 'run', ph: (T * 0.07) % 1, arm: 'panic', face: 'panic' }, null);
  ctx.restore();
  if ((T >> 5) % 2 === 0 || G.scene === 'starting') drawText(Input.touchMode ? 'TAP TO START' : 'PRESS START', W / 2, 146, G.scene === 'starting' && (T >> 1) % 2 ? '#ffffff' : GRAD_GOLD, 2, 1);
  drawControlsBox(176);
  drawText('HI ' + String(G.hi).padStart(8, '0'), W - 8, 4, '#ffe080', 1, 2);
  drawText('100% PROCEDURAL - NO ASSETS', 8, 4, '#a898b8', 1, 0);
  if (G.scene === 'starting') { ctx.globalAlpha = Math.min(1, G.startT / 50); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
function drawTouch() {
  if (!Input.touchMode) return;
  if (G.scene !== 'play') {
    return;
  }
  ctx.globalAlpha = 0.3;
  dcirc(DPAD.x, DPAD.y, DPAD.r, '#ffffff');
  ctx.globalAlpha = 0.5;
  dcirc(DPAD.x, DPAD.y, 12, '#20182a');
  const dirs = [['left', -1, 0, '['], ['right', 1, 0, ']'], ['up', 0, -1, '^'], ['down', 0, 1, 'v']];
  for (const [b, dx, dy, ch] of dirs) {
    ctx.globalAlpha = Input.down(b) ? 0.9 : 0.5;
    drawText(ch, DPAD.x + dx * 28, DPAD.y + dy * 28 - 5, '#ffffff', 2, 1);
  }
  for (const b of TOUCH_BTNS) {
    ctx.globalAlpha = Input.down(b.b) ? 0.7 : 0.35;
    dcirc(b.x, b.y, b.r, b.b === 'fire' ? '#ff6040' : b.b === 'jump' ? '#40a0ff' : b.b === 'bomb' ? '#70d040' : '#ffffff');
    ctx.globalAlpha = 0.9;
    drawText(b.label, b.x, b.y - 3, '#ffffff', 1, 1);
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------
//  BOOT + MAIN LOOP
// ---------------------------------------------------------------------
function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  let s = Math.min(ww / W, wh / H);
  if (s >= 1) { const si = Math.floor(s); if (si / s > 0.86) s = si; }
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = Math.floor((ww - cw) / 2) + 'px'; cv.style.top = Math.floor((wh - ch) / 2) + 'px';
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.scene === 'play' && !G.endSeq) { G.scene = 'pause'; G.menu = 0; Music.duck(true); }
});
function boot() {
  resize();
  buildLevel();
  prerenderLevel();
  buildBackgrounds();
  G.player = makePlayer(60, GY);
  G.scene = 'title';
  let last = performance.now(), acc = 0;
  const STEP = 1000 / 60;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = now - last; last = now;
    if (dt > 250) dt = 250;
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 5) {
      try { tick(); } catch (err) { reportError(err); }
      acc -= STEP; n++;
    }
    if (n >= 5) acc = 0;
    try { render(); } catch (err) { reportError(err); }
  }
  requestAnimationFrame(frame);
}
let lastErr = 0;
function reportError(err) {
  if (typeof console !== 'undefined') console.error(err);
  window.__gameErrors = (window.__gameErrors || 0) + 1;
  lastErr = err;
}
window.__G = G;
window.__dbg = { groundYAt, exitTank, startBossFight, spawnFromEvent, startLevel };
boot();

})();
</script>
